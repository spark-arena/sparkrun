repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.3
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: [ --fix ]
        exclude: '^(src/sparkrun/plugins/sparkroute/|tests/vendor/sparkroute/)'
      - id: ruff-format
        exclude: '^(src/sparkrun/plugins/sparkroute/|tests/vendor/sparkroute/)'
  - repo: local
    hooks:
      - id: verify-sparkroute-vendor
        name: Verify SparkRoute vendor snapshot
        entry: python scripts/vendor-sparkroute.py verify
        language: python
        pass_filenames: false
        always_run: true
