recipe_version: "2"
name: tensorfold-nemotron-3.5-lightning
description: >-
  NVIDIA Nemotron 3.5 Lightning 30B-A3B (MLX 4-bit) on one DGX Spark with
  TensorFold 1.1.3. Single-node only; the default DGX Spark image is
  ghcr.io/spark-arena/tensorfold:1.1.3 (build it locally with
  docker/tensorfold/build.sh --load).
model: TensorFold/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-MLX-4bit
runtime: tensorfold
min_nodes: 1
max_nodes: 1
defaults:
  port: 8000
  max_model_len: 8192
  max_num_seqs: 4
  thinking: false
