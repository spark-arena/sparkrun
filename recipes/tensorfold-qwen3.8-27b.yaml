recipe_version: "2"
name: tensorfold-qwen3.8-27b
description: >-
  Qwen3.8-27B (MLX 4-bit) on one DGX Spark with TensorFold 1.1.3 and its
  DFlash2 drafter. TensorFold reads the pre-distributed HF snapshot from the
  mounted cache; no model is downloaded by the engine. Build the pinned image
  with docker/tensorfold/build.sh --load (arm64) or override container:.
model: TensorFold/Qwen3.8-27B-MLX-4bit
model_revision: null
runtime: tensorfold
min_nodes: 1
max_nodes: 1
defaults:
  port: 8000
  max_model_len: 32768
  max_num_seqs: 4
  drafter: z-lab/Qwen3.8-27B-DFlash2
  drafter_bits: 4
  thinking: false
distribution_config:
  additional_models:
    - name: z-lab/Qwen3.8-27B-DFlash2
