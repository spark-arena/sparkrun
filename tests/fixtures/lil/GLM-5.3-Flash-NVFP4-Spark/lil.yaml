schema_version: 1
kind: model
model: local-inference-lab/GLM-5.3-Flash-NVFP4-Spark
family: glm
description: GLM-5.3 Flash with NVFP4 routed experts, MXFP8 projections, and an NVFP4 MTP expert layer
serving:
  served_model_name: zai-org/GLM-5.3-Flash
  multimodal:
    encoder_tp_mode: data
    processor_cache_gb: 0
precision:
  quantization: modelopt_mixed
cache:
  block_size: 256
  mamba_cache_mode: align
kernels:
  flashinfer_autotune: false
speculators:
  default: mtp
  mtp:
    tokens: 5
    moe_quantization: nvfp4
    attention: B12X
  dflash:
    tokens: 7
    model: local-inference-lab/GLM-5.3-Flash-DFlash2
environment:
  VLLM_SSM_CONV_STATE_LAYOUT: DS
