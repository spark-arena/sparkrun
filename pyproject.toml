[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkrun"
version = "0.4.0"
description = "Launch and manage Docker-based inference workloads on NVIDIA DGX Spark systems"
readme = "README.md"
# Distribution metadata covers host and plugin; their individual terms remain
# in the retained license files, including the sparkrun combination permission.
license = "Apache-2.0 AND AGPL-3.0-only"
license-files = ["LICENSE", "src/sparkrun/plugins/*/LICENSE", "src/sparkrun/plugins/*/LICENSE_EXCEPTION", "src/sparkrun/orchestration/executors/seccomp/LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "scitrera.ai", email = "open-source-team@scitrera.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Clustering",
]
dependencies = [
    "scitrera-app-framework==0.0.69",
    "vpd==0.9.13",
    "six==1.17.0", # transitive dependency of vpd but we pin the version for security reasons
    "idna==3.15", # transitive (requests/huggingface-hub) pinned to the CVE-2026-45409 fix
    "pygments==2.20.0", # transitive (rich/textual) pinned to the CVE-2026-4539 fix
    "click==8.3.3",
    "pyyaml==6.0.3",
    "huggingface-hub==1.8.0",
    "textual==8.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pyright[nodejs]==1.1.414",
]

[project.scripts]
sparkrun = "sparkrun.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sparkrun" = ["py.typed"]
"sparkrun.scripts" = ["*.sh"]
"sparkrun.orchestration.executors" = ["seccomp/*.json", "seccomp/LICENSE", "seccomp/README.md"]
"sparkrun.plugins.sparkroute" = ["LICENSE", "LICENSE_EXCEPTION", "README.md", "VENDORED.toml"]
"sparkrun.plugins.coldsnap" = ["LICENSE", "LICENSE_EXCEPTION", "README.md", "VENDORED.toml"]
"sparkrun.plugins.lil" = ["LICENSE", "bases.yaml"]
"sparkrun.bin" = ["nv-monitor-*", "prom2json-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
required-version = "==0.16.6"
# Vendor snapshots are immutable, including when hooks pass explicit filenames.
extend-exclude = ["src/sparkrun/plugins/sparkroute", "tests/vendor/sparkroute", "src/sparkrun/plugins/coldsnap", "tests/vendor/coldsnap"]
force-exclude = true

[tool.ruff.format]
# Documentation includes partial Python examples; its own contract tests check
# syntax/imports without rewriting excerpts as standalone programs.
exclude = ["*.md"]

[tool.ruff.lint]
# ruff's default set (E4/E7/E9/F) plus flake8-bugbear.  B is enforced rather
# than merely available because its three recurring findings here are each a
# silent failure: an unchained `raise` inside `except` loses the traceback that
# names the real cause, and a `zip()` without `strict=` truncates to the shorter
# input rather than reporting the skew.  Keeping it green means every new
# `zip()` states which it wants.
select = ["E4", "E7", "E9", "F", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff==0.16.6",
    "pyright[nodejs]==1.1.414",
]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
