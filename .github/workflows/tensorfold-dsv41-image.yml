# TensorFold DeepSeek-V4.1 community image — build on PR, publish manually.
#
# This image compiles Zig + CUDA from a pinned fork, so it runs on a NATIVE
# arm64 runner (the GitHub-hosted ubuntu-24.04-arm image) rather than under
# QEMU.  The build needs network access to codeload.github.com, PyPI (Zig wheel)
# and the NVIDIA container image.
#
# The build is experimental by nature: it follows the community TensorFold fork
# and the tonyd2wild TP2/TP4 patches, not the upstream release.

name: TensorFold DeepSeek-V4.1 Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Publish to GHCR (otherwise build only)"
        type: boolean
        default: false
  pull_request:
    paths:
      - 'docker/tensorfold-dsv41/**'
      - '.github/workflows/tensorfold-dsv41-image.yml'
      - 'tests/test_tensorfold_image.py'

permissions:
  contents: read

env:
  PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned inputs
        run: |
          set -a; . ./docker/tensorfold-dsv41/image.env; set +a
          for key in IMAGE_REPO IMAGE_TAG TF_FORK_SHA CUDA_DEVEL_TAG CUDA_TAG NCCL_APT_VERSION ZIG_VERSION TARGET_SM TOKENIZERS_VERSION; do
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and optionally publish)
        uses: docker/build-push-action@v6
        with:
          context: docker/tensorfold-dsv41
          platforms: linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          build-args: |
            TF_SHA=${{ env.TF_FORK_SHA }}
            CUDA_DEVEL_TAG=${{ env.CUDA_DEVEL_TAG }}
            CUDA_TAG=${{ env.CUDA_TAG }}
            NCCL_APT_VERSION=${{ env.NCCL_APT_VERSION }}
            ZIG_VERSION=${{ env.ZIG_VERSION }}
            TARGET_SM=${{ env.TARGET_SM }}
            TOKENIZERS_VERSION=${{ env.TOKENIZERS_VERSION }}
          cache-from: type=gha,scope=tensorfold-dsv41
          cache-to: type=gha,mode=max,scope=tensorfold-dsv41
