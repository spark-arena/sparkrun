# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Publish (Python)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: publish-python
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/test-python.yml

  verify-tag:
    name: Verify tag matches sparkrun version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Verify versions are in sync
        run: uvx --from 'git+https://github.com/scitrera/repo-tools.git@4a2ae8b966a875f6dc21ec8c142220a0471e06e8' sync-versions --check --verbose

      - name: Compare tag against versions.yaml
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(uvx --from 'git+https://github.com/scitrera/repo-tools.git@4a2ae8b966a875f6dc21ec8c142220a0471e06e8' sync-versions --print-version sparkrun)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the sparkrun version declared in versions.yaml ($declared)"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versions.yaml ($declared)."

  publish-sparkrun:
    name: Publish sparkrun to PyPI
    runs-on: ubuntu-latest
    needs: [ tests, verify-tag ]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rewrite local refs to version pins
        run: uvx --from 'git+https://github.com/scitrera/repo-tools.git@4a2ae8b966a875f6dc21ec8c142220a0471e06e8' sync-versions --release

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
        working-directory: .

      - name: Check whether this version is already published
        id: published
        working-directory: .
        run: |
          set -euo pipefail
          name=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project'].get('name',''))")
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project'].get('version',''))")
          if [ -z "$version" ]; then
            echo "::error::pyproject.toml declares no static version (dynamic?); ci.python.skip_if_published cannot determine what to look up"
            exit 1
          fi
          if curl -sfL -o /dev/null "https://pypi.org/pypi/$name/$version/json"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name $version is already on PyPI; skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI (trusted publisher)
        if: steps.published.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-sparkrun
          path: ./dist/
          if-no-files-found: error

  github-release:
    name: Attach distributions to GitHub release
    runs-on: ubuntu-latest
    needs: [ publish-sparkrun ]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
